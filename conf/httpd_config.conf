#
# OpenLiteSpeed configuration for WordPress
# Derived from the image's default httpd_config.conf so the syntax is valid.
#

serverName              ols-wordpress
user                    nobody
group                   nogroup
priority                0
autoRestart             1
chrootPath              /
enableChroot            0
inMemBufSize            60M
swappingDir             /tmp/lshttpd/swap
autoFix503              1
gracefulRestartTimeout  300
mime                    conf/mime.properties
showVersionNumber       0
adminEmails             webmaster@example.com
indexFiles              index.php, index.html
disableWebAdmin         0

errorlog logs/error.log {
    logLevel             NOTICE
    rollingSize          10M
    enableStderrLog      1
}

accessLog logs/access.log {
    rollingSize          10M
    keepDays             30
    compressArchive      0
    logReferer           1
    logUserAgent         1
}

vhTemplate docker {
    templateFile         conf/templates/docker.conf
    listeners            HTTP, HTTPS
    note                 docker

    member localhost {
        vhDomain         localhost, *
    }
}

listener HTTP {
    address              *:80
    secure               0
}

listener HTTPS {
    address              *:443
    secure               1
    keyFile              /usr/local/lsws/conf/vhosts/cert.pem
    certFile             /usr/local/lsws/conf/vhosts/key.pem
}
