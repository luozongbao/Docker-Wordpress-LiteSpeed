services:
  # MariaDB — uses the existing production volume so no data is lost.
  database:
    image: mariadb:10.11
    container_name: wp_mariadb
    restart: always
    environment:
      - MYSQL_DATABASE=${DATABASENAME}
      - MYSQL_USER=${DATABASEUSER}
      - MYSQL_PASSWORD=${DATABASEPASS}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  wordpress:
    image: litespeedtech/openlitespeed:latest
    container_name: wp_ols
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "7080:7080"   # WebAdmin Console of OpenLiteSpeed
    environment:
      - TZ=Asia/Bangkok
      - ADMIN_USER=${OLS_ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${OLS_ADMIN_PASSWORD:-P@ssw0rd}
    volumes:
      - ./www:/var/www/vhosts/localhost/html
      - ./logs:/usr/local/lsws/logs
# เพิ่มคำสั่งนี้เพื่อเซ็ตรหัสผ่านก่อนแล้วค่อยเริ่มรัน entrypoint ปกติ
    command: >
      sh -c 'echo "$${ADMIN_USER}:$(openssl passwd -1 "$${ADMIN_PASSWORD}")" > /usr/local/lsws/admin/conf/htpasswd && chmod 600 /usr/local/lsws/admin/conf/htpasswd && /entrypoint.sh'

    depends_on:
      - database
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: