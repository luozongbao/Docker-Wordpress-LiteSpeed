services:
  # MariaDB — uses the existing production volume so no data is lost.
  database:
    image: mariadb:10.11
    container_name: wp_mariadb
    restart: always
    environment:
      - MYSQL_DATABASE=${DATABASENAME}
      - MYSQL_USER=${DATABASEUSER}
      - MYSQL_PASSWORD=${DATABASEPASS}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  # OpenLiteSpeed — replaces the old nginx container.
  # OLS runs LSPHP (LSAPI) inside this single container, so PHP-FPM as a
  # separate service is no longer needed.
  wordpress:
    image: litespeedtech/openlitespeed:latest
    container_name: wp_ols
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "7080:7080"   # WebAdmin Console of OpenLiteSpeed
    environment:
      - TZ=Asia/Bangkok
    volumes:
      - ./www:/var/www/html
      - ./ols-conf:/usr/local/lsws/conf
      - ./ols-admin-conf:/usr/local/lsws/admin/conf
    depends_on:
      - database
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
    external: true