# OpenLiteSpeed main configuration for banrimkwae.com
# Uses the default "localhost" vhost that ships with the OLS image, with
# docroot pointed at /var/www/html (where ./www is bind-mounted) and the
# built-in LSPHP external app (no PHP-FPM container needed).

serverName                servername-ols
user                      nobody
group                     nogroup
priority                  0
enableLVE                 0
insecureRenegotiation     0

adminEmails               user@email.com

# Default index files
indexFiles                index.php,index.html

# ---- Logging ---------------------------------------------------------------
log:
  useServer               0
  fileLogger:
    fileName              ${SERVER_ROOT}/logs/error.log
    logLevel              NOTICE
    rollingSize           10M

accessLog:
  fileLogger:
    fileName              ${SERVER_ROOT}/logs/access.log
    logFormat             '%h %l %u %t "%r" %>s %b "%{Referer}i" "%{User-Agent}i"'
    rollingSize           10M

# ---- Listeners -------------------------------------------------------------
listener:
  - address: *:80
    secure: 0
    name: HTTP

  - address: *:443
    secure: 1
    name: HTTPS
    keyFile:  /usr/local/lsws/conf/vhosts/cert.pem
    certFile: /usr/local/lsws/conf/vhosts/key.pem

# ---- Virtual hosts ---------------------------------------------------------
vhRoot:
  ${SERVER_ROOT}/vhosts

# Map the default `localhost` vhost to /var/www/html (WordPress docroot).
# `localhost.vhconf` already exists in the image and defines an LSAPI
# handler bound to `lsphp`, so no custom extprocessor is required.
vhModule:
  localhost:
    type: VHOST

virtualHost:
  localhost:
    vhRoot:
      /var/www/html
    configFile:
      $SERVER_ROOT/vhosts/localhost/vhconf.conf
    allowSymbolLink: 1
    enableScript: 1
    docRoot:
      /var/www/html