# OpenLiteSpeed main configuration for banrimkwae.com
# Minimal config that enables a single vhost + PHP-FPM external app.

serverName                banrimkwae-ols
user                      nobody
group                     nogroup
priority                  0
enableLVE                 0
insecureRenegotiation     0

adminEmails               webmaster@banrimkwae.com

# Default index files
indexFiles                index.php,index.html

# Logging
log:
  useServer               0
  fileLogger:
    fileName              ${SERVER_ROOT}/logs/error.log
    logLevel              NOTICE
    rollingSize           10M

accessLog:
  fileLogger:
    fileName              ${SERVER_ROOT}/logs/access.log
    logFormat             '%h %l %u %t "%r" %>s %b "%{Referer}i" "%{User-Agent}i"'
    rollingSize           10M

# Default listeners
listener:
  - address: *:80
    secure: 0
    name: HTTP

  - address: *:443
    secure: 1
    name: HTTPS
    keyFile: /usr/local/lsws/conf/vhosts/banrimkwae/key.pem
    certFile: /usr/local/lsws/conf/vhosts/banrimkwae/cert.pem

# Default virtual host root
vhRoot:
  ${SERVER_ROOT}/vhosts

# Load banrimkwae vhost
vhModule:
  banrimkwae:
    type: VHOST

virtualHost:
  banrimkwae:
    vhRoot:
      ${SERVER_ROOT}/vhosts/banrimkwae
    configFile:
      $SERVER_ROOT/vhosts/banrimkwae/vhconf.conf
    allowSymbolLink: 1
    enableScript: 1
    scriptHandler:
      - suffix: php
        type: LSAPI
        handler: [php-fpm address]
        name: php-fpm

extprocessor:
  php-fpm:
    type: LSAPI
    address: php:9000
    maxConns: 100
    initTimeout: 60
    retryTimeout: 0
    persistConn: 1
    pcKeepAliveTimeout: 60
    respBuffer: 0
    autoStart: 1
    path: /usr/local/lsws/fcgi-bin/lsphp