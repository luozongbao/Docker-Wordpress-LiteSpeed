# OpenLiteSpeed vhost configuration for banrimkwae.com
# This is the equivalent of the old nginx server {} block.

docRoot                   /var/www/html
enableScript              1
allowSymbolLink           1

# Main vhost-level settings
indexFiles                index.php,index.html
rewrite:
  enable                  1
  logLevel                0

context:
  # Block wp-config.php from public access
  - type: NULL
    uri: /wp-config.php
    access:
      deny: *

  # Block xmlrpc.php
  - type: NULL
    uri: /xmlrpc.php
    access:
      deny: *

  # Protect AI / context files with a token (matches old Nginx token)
  - type: NULL
    uri: /context/
    access:
      condition:
        - allow: 0
        - deny: 1
        - key: $HTTP_AUTHORIZATION
        - val: 'b929f5a77a7970d28ea5efad480c1c696dec9061b36fe121b604a2a6a7b95b2a'
      allow: 1

  # Block install/upgrade scripts
  - type: NULL
    uriPrefix: /wp-admin/
    location: ^/wp-admin/(install|upgrade)\.php$
    access:
      deny: *

  # Block dotfiles
  - type: NULL
    uriPrefix: /.
    access:
      deny: *

  # Prevent PHP execution in uploads
  - type: NULL
    uriRegex: \.(?:uploads|files)/.*\.php$
    access:
      deny: *

  # WP debug log
  - type: NULL
    uri: /wp-content/debug.log
    access:
      deny: *

  # Static files cache (1 year)
  - type: static
    uriRegex: \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$
    extraHeaders:
      'Cache-Control: public, max-age=31536000, immutable'

  # PHP handler
  - type: LSAPI
    uri: *.php
    handler: php-fpm
    extraHeaders:
      'X-Frame-Options: SAMEORIGIN'
      'X-Content-Type-Options: nosniff'
      'X-XSS-Protection: 1; mode=block'
      'Referrer-Policy: strict-origin-when-cross-origin'

# WordPress permalink rewrite
rewriteRules:
  - ^(.*)$ - $1

# Listener bindings
vhListener:
  - listenerName: HTTP
    allow: *
  - listenerName: HTTPS
    allow: *

# Access log
accessLog:
  fileLogger:
    fileName: ${VH_ROOT}/logs/access.log
    logFormat: '%h %l %u %t "%r" %>s %b "%{Referer}i" "%{User-Agent}i"'
    rollingSize: 10M